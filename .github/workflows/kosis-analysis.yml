name: kosis construction starts

# 부산청 관할 시·군별 건축 착공(민간 포함) 통계 조회 (작업 브랜치 push 시에만 실행)
on:
  push:
    branches: [claude/busan-safety-guidance-location-12o32z]
    paths: ['analysis/kosis_*', '.github/workflows/kosis-analysis.yml']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
      # 시도별 건축착공현황: 부산·울산·경남 / 용도 계 / 상세용도 계 / 동수·연면적 / 합계
      ORG_ID: '116'
      TBL_ID: DT_MLTM_2202
      ITM_ID: 13103792712T1
      OBJ_L1: '13102792712A.0003 13102792712A.0009 13102792712A.0020'
      OBJ_L2: '13102792712B.0001'
      OBJ_L3: '13102792712C.0001'
      OBJ_L4: 'ALL'
      OBJ_L5: '13102792712E.0001'
      PRD_SE: M
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python analysis/kosis_starts.py
